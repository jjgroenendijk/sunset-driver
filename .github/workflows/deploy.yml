name: Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only changes skip the build. The filter is a job rather than a
  # workflow-level `paths-ignore` because `build-and-deploy` is a required
  # check: a workflow filtered out by path never reports and would block the
  # merge, while a job skipped by `if` counts as satisfied.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -u
          # Build unless every changed file is documentation. An unknown base
          # (new branch, force push) and an empty diff both fall through to
          # building, so a missed skip costs a CI run, never a missed check.
          git cat-file -e "$BASE^{commit}" 2>/dev/null || { echo 'code=true' >> "$GITHUB_OUTPUT"; exit 0; }
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "$changed"
          if echo "$changed" | grep -qvE '(\.md$|^\.claude/)'; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
          else
            echo 'code=false' >> "$GITHUB_OUTPUT"
          fi

  build-and-deploy:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules
        id: modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:full
      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=sunset-driver --branch=${{ github.head_ref || github.ref_name }} --commit-dirty=true --commit-hash=${{ github.event.pull_request.head.sha || github.sha }}
