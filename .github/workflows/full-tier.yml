name: Full tier

# A reusable workflow: `ci.yml` calls it on every pull request. It runs
# `verify:full` split over two runners: the seed sweep, and every other file with
# the typecheck and both lints. The seed sweep is most of the tier's work: on a
# runner it takes about 100 s and the rest about 25 s. On Actions vitest adds its
# `github-actions` reporter, which writes the job summary and marks each failure
# on its line.
on:
  workflow_call:

# On a Dependabot pull request the shards run an update nobody has read, so
# they hold a read-only token. A cache they save stays in the pull request's
# scope, which main never reads.
permissions:
  contents: read

jobs:
  shard:
    # The check names the ruleset requires: `full-tier / seed-sweep` and
    # `full-tier / other`.
    name: ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: seed-sweep
            files: test/seed-sweep.test.ts
          # Every other file, so a new test file runs here without a change.
          - shard: other
            files: --exclude test/seed-sweep.test.ts
            checks: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - if: matrix.checks
        run: npm run typecheck && npm run lint && npm run lint:size
      - run: npm run test:full -- ${{ matrix.files }}
