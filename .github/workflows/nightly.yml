name: Nightly

on:
  schedule:
    # 02:00 UTC, after the day's merges and after Dependabot has opened the
    # night's updates (`.github/dependabot.yml`).
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # Chooses the tree: main plus every open Dependabot pull request that merges
  # onto it cleanly. A pull request that conflicts waits for Dependabot to
  # rebase it.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      prs: ${{ steps.plan.outputs.prs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config user.name nightly
          git config user.email nightly@users.noreply.github.com
          changed=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] ||
             [ -n "$(git log --since='24 hours ago' --format=%H -1)" ]; then
            changed=true
          fi
          prs=''
          for pr in $(gh pr list --app dependabot --base main --state open \
                        --json number,headRefOid --jq '.[] | "\(.number):\(.headRefOid)"'); do
            number=${pr%%:*}
            git fetch -q origin "pull/$number/head"
            if git merge -q --no-edit "${pr#*:}"; then
              prs="$prs $pr"
            else
              git merge --abort
              echo "#$number does not merge onto main cleanly; skipping it."
            fi
          done
          run=true
          if [ "$changed" = false ] && [ -z "$prs" ]; then
            echo 'No commit on main in the last 24 hours and no update; skipping.' |
              tee -a "$GITHUB_STEP_SUMMARY"
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "prs=${prs# }" >> "$GITHUB_OUTPUT"

  # The full tier on the tree the plan chose.
  test:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    uses: ./.github/workflows/full-tier.yml
    with:
      name: updates
      prs: ${{ needs.plan.outputs.prs }}

  # When the tree with the updates fails, main is tested alone, so the issue
  # says which of the two is broken.
  test-main:
    needs: [plan, test]
    if: always() && needs.plan.outputs.prs != '' && needs.test.result == 'failure'
    uses: ./.github/workflows/full-tier.yml
    with:
      name: main

  # Merges and reports. It reads the shards' artifacts as data and never runs a
  # package's code.
  merge:
    needs: [plan, test, test-main]
    if: always() && needs.plan.outputs.run != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PRS: ${{ needs.plan.outputs.prs }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: results

      - env:
          TEST_RESULT: ${{ needs.test.result }}
          MAIN_RESULT: ${{ needs.test-main.result }}
        run: |
          set -u
          shopt -s nullglob
          # passed, failed or unfinished for the artifacts named `$1-<shard>`.
          # A shard that timed out or was cancelled uploaded nothing, so a tree
          # only passes when its whole run passed.
          state() {
            local result=$2 dir
            if [ "$result" = success ]; then echo passed; return; fi
            for dir in results/"$1"-*; do
              if [ "$(cat "$dir/outcome" 2>/dev/null)" = failed ]; then echo failed; return; fi
            done
            echo unfinished
          }
          # The end of the log of each shard that did not pass.
          log_of() {
            local dir
            for dir in results/"$1"-*; do
              [ "$(cat "$dir/outcome" 2>/dev/null)" = passed ] && continue
              printf '%s:\n' "${dir#results/}"
              sed 's/\x1b\[[0-9;]*m//g' "$dir/test.log" 2>/dev/null | tail -n 80
            done
          }
          # The job summary keeps the cost of the full tier from night to night.
          summarise() {
            local dir wall user sys cpu
            echo "#### $1"
            echo
            echo '| Shard | Outcome | Wall clock | CPU-seconds (user + system) |'
            echo '|---|---|---|---|'
            for dir in results/"$1"-*; do
              read -r wall user sys 2>/dev/null < "$dir/time.txt" || true
              cpu=''
              # The shard wrote these files, so they are checked before awk reads them.
              if [[ "${wall-}${user-}${sys-}" =~ ^[0-9.]+$ ]]; then
                cpu="$(awk -v u="$user" -v s="$sys" 'BEGIN { print u + s }') s"
                wall="$wall s"
              else
                wall=''
              fi
              echo "| ${dir#results/} | $(head -c 20 "$dir/outcome" 2>/dev/null) | $wall | $cpu |"
              unset wall user sys
            done
            echo
            reports=(results/"$1"-*/report.json)
            if [ ${#reports[@]} -gt 0 ]; then
              jq -rs '"- Test files: \(map(.numTotalTestSuites) | add)",
                "- Tests: \(map(.numPassedTests) | add) passed, \(map(.numFailedTests) | add) failed"' \
                "${reports[@]}" || true
              echo
            fi
          }

          updates=$(state updates "$TEST_RESULT")
          main=$(state main "$MAIN_RESULT")
          case "$updates" in
            passed) verdict=passed ;;
            unfinished) verdict=unfinished ;;
            *)
              if [ -z "$PRS" ]; then verdict='main-failed'
              elif [ "$main" = passed ]; then verdict='updates-failed'
              elif [ "$main" = failed ]; then verdict='main-failed'
              else verdict=unfinished
              fi
              ;;
          esac

          {
            echo "### Nightly: $verdict"
            echo
            if [ -n "$PRS" ]; then echo "Updates tested: $PRS"; echo; fi
            summarise updates
            [ "$updates" = passed ] || [ -z "$PRS" ] || summarise main
          } >> "$GITHUB_STEP_SUMMARY"

          # One open issue per kind of failure: a later night comments on it.
          report() {
            gh label create nightly-failure --color d73a4a \
              --description 'The nightly run failed' 2>/dev/null || true
            open=$(gh issue list --label nightly-failure --state open --json number,title \
                     --jq ".[] | select(.title == \"$1\") | .number" | head -n 1)
            if [ -n "$open" ]; then
              gh issue comment "$open" --body-file body.md
            else
              gh issue create --title "$1" --label nightly-failure --label bug --body-file body.md
            fi
          }
          log_block() {
            printf '\nRun: %s\n\nThe end of the log:\n\n```\n%s\n```\n' "$RUN_URL" "$(log_of "$1")"
          }
          list_prs() {
            for pr in $PRS; do echo "- #${pr%%:*} at \`${pr#*:}\`"; done
          }

          case "$verdict" in
            passed)
              merged=0
              failed=''
              for pr in $PRS; do
                # The head must still be the commit the full tier tested.
                if gh pr merge "${pr%%:*}" --rebase --match-head-commit "${pr#*:}"; then
                  merged=$((merged + 1))
                else
                  failed="$failed $pr"
                fi
              done
              # A merge made with this token starts no push workflow, so the
              # deploy is started by hand.
              if [ "$merged" -gt 0 ]; then gh workflow run ci.yml --ref main; fi
              if [ -n "$failed" ]; then
                PRS=${failed# }
                { echo 'These Dependabot updates passed the full tier but could not be merged:'
                  echo; list_prs
                  printf '\nRun: %s\n' "$RUN_URL"; } > body.md
                report 'Nightly could not merge a Dependabot update'
              fi
              ;;
            updates-failed)
              { echo 'Main passes the full tier, but these Dependabot updates make it fail:'
                echo; list_prs; echo
                echo 'They were not merged.'; log_block updates; } > body.md
              report 'Nightly: a Dependabot update fails the full test tier'
              ;;
            main-failed)
              { echo "The full test tier fails on main at \`$GITHUB_SHA\`."
                echo 'No Dependabot update was merged.'
                if [ -n "$PRS" ]; then log_block main; else log_block updates; fi; } > body.md
              report 'Nightly full test tier failed'
              ;;
            *)
              # A shard stopped before it reached an outcome: a checkout, an
              # install, a timeout or a cancel.
              { echo 'The nightly run stopped before it finished.'
                echo 'No Dependabot update was merged.'; log_block updates; } > body.md
              report 'Nightly run did not finish'
              ;;
          esac
          [ "$verdict" = passed ]
