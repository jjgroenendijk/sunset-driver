name: Nightly

# The full tier on main. Dependabot pull requests run it in `ci.yml` instead.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/full-tier.yml

  # One open issue for a failing main: a later night comments on it.
  report:
    needs: test
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BODY: >-
        The full test tier fails on main at `${{ github.sha }}`:
        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: |
          open=$(gh issue list --label nightly-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$BODY"
          else
            gh issue create --title 'Nightly full test tier failed' --label nightly-failure --label bug --body "$BODY"
          fi
