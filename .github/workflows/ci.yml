name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A merge made with the workflow token starts no push workflow, so the
  # Dependabot merge below starts the deploy by hand.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The artifact a pull request built from the tree main now holds. A rebase
  # merge of an up-to-date branch gives the same tree. A manual run has no
  # head commit, so it does not look and builds.
  PREBUILT: dist-${{ github.event.head_commit.tree_id }}

jobs:
  # Only artifacts from runs of this repository count: a fork's run could upload
  # anything.
  find-dist:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run-id: ${{ steps.find.outputs.run-id }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          echo "run-id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$PREBUILT" --jq
          "[.artifacts[] | select((.expired | not) and .workflow_run.head_repository_id == $GITHUB_REPOSITORY_ID)]
          | .[0].workflow_run.id // empty")" >> "$GITHUB_OUTPUT"

  # Main builds only when no pull request built the same tree.
  build:
    needs: find-dist
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.find-dist.outputs.run-id == '') }}
    uses: ./.github/workflows/build.yml

  # Every pull request runs the full tier, and main runs no tests: it holds the
  # tree a pull request tested. The build and both shards are required to merge.
  full-tier:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/full-tier.yml

  # The world is a pure function of its seed, so the browser must build the city
  # Node builds. Nothing checked that until issue #243, where `Math.cos` rounded
  # one bit differently in the two engines and the page traced a different road
  # network. It runs in a job of its own rather than beside `render-smoke`: it
  # opens no graphics device, so it has none of that job's flakiness and can
  # gate the merge. The ruleset decides what gates, not this file.
  world-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # The same browser and the same cache key as `render-smoke`, so the two
      # jobs share one download. Nothing here draws, so the headless shell is
      # all this needs.
      - id: browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.browser.outputs.cache-hit != 'true'
        run: node_modules/.bin/playwright-core install --no-shell chromium

      - run: npm run test:world

  # One frame through a real WebGPU device, which no other job opens: it fails
  # when the renderer draws nothing (issue #119). It is kept out of `full-tier`
  # because it is not part of `verify:full`, and out of the checks that gate the
  # merge because SwiftShader draws on a shared runner's processor and a device
  # lost there is not a rendering regression. The ruleset decides what gates,
  # not this file.
  #
  # Issue #339 blanks the frame on some Chromium builds, which would fail this
  # check for a reason that is not the change under test. The build installed
  # here is not one of them; `docs/dev-tooling.md` says how to tell.
  render-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # playwright-core ships no browser of its own. The key follows the
      # lockfile, as the Node and module caches do, so a playwright bump fetches
      # the build that release was made against.
      - id: browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # The installed `playwright-core` fetches the build it names. `npx
      # playwright` would download a second package at whatever version the
      # registry holds that day, and with it a browser the lockfile never saw.
      # The headless shell draws no WebGPU, so it is not worth caching.
      - if: steps.browser.outputs.cache-hit != 'true'
        run: node_modules/.bin/playwright-core install --no-shell chromium

      - run: npm run test:render

  # The head must still be the commit the full tier tested. A branch that fell
  # behind main cannot merge, so Dependabot is asked to rebase it, which tests
  # it again.
  merge-update:
    needs: [build, full-tier]
    # Without a status function the job is skipped, because `find-dist`, which
    # `build` needs, is skipped on a pull request.
    if: >-
      ${{ !cancelled() && github.event.pull_request.user.login == 'dependabot[bot]' &&
      needs.build.result == 'success' && needs.full-tier.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - run: |
          if gh pr merge "$PR" --rebase --match-head-commit "$HEAD"; then
            gh workflow run ci.yml --ref main
          else
            gh pr comment "$PR" --body '@dependabot rebase'
          fi

  # Only main deploys. A pull request publishes nothing, so one change reaches
  # Cloudflare once.
  deploy:
    needs: [find-dist, build]
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' &&
      (needs.build.result == 'success' ||
      (needs.build.result == 'skipped' && needs.find-dist.outputs.run-id != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions
            .nvmrc
            package.json
            package-lock.json
          sparse-checkout-cone-mode: false
      # Wrangler is the version `package-lock.json` pins, from the build's cache.
      # A miss installs without install scripts, which wrangler does not need.
      - uses: ./.github/actions/setup
        with:
          ignore-scripts: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.find-dist.outputs.run-id && env.PREBUILT || needs.build.outputs.artifact }}
          run-id: ${{ needs.find-dist.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}
          path: dist

      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          node_modules/.bin/wrangler pages deploy dist --project-name=sunset-driver
          --branch="$GITHUB_REF_NAME" --commit-dirty=true --commit-hash="$GITHUB_SHA"
