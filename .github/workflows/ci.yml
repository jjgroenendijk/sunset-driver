name: CI

on:
  push:
    branches: [main]
  pull_request:
  # `nightly.yml` starts a deploy after it merges updates, because a merge made
  # with its token starts no push workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only changes skip the build. The filter is a job rather than a
  # workflow-level `paths-ignore`, because a workflow filtered out by path
  # never reports its checks and would block the merge.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -u
          # Build unless every changed file is documentation. An unknown base
          # (new branch, force push) and an empty diff both fall through to
          # building, so a missed skip costs a CI run, never a missed check.
          git cat-file -e "$BASE^{commit}" 2>/dev/null || { echo 'code=true' >> "$GITHUB_OUTPUT"; exit 0; }
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "$changed"
          if echo "$changed" | grep -qvE '(\.md$|^\.claude/)'; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
          else
            echo 'code=false' >> "$GITHUB_OUTPUT"
          fi

  # The size lint runs on every change, because a docs-only commit skips the
  # build below and markdown has limits of its own. It needs no dependencies:
  # `check-size.ts` reads files and nothing else.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm run lint:size

  # A pull request proves the code typechecks, lints and builds. Main only
  # builds, because the pull request already checked the same tree.
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/build.yml
    with:
      checks: ${{ github.event_name == 'pull_request' }}

  # Only main deploys, from the `dist` the build uploaded. A pull request
  # publishes nothing, so one change reaches Cloudflare once.
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The job has no checkout, so the action installs wrangler itself.
          # Keep the major version with the one in `package.json`.
          wranglerVersion: '4'
          command: pages deploy dist --project-name=sunset-driver --branch=${{ github.ref_name }} --commit-dirty=true --commit-hash=${{ github.sha }}

  # The one required check. A job that calls a reusable workflow reports under
  # a name of its own (`build / build`), and under another when it is skipped,
  # so the rules on main require this job instead. It fails when a job it
  # waits for failed or was cancelled, and passes when the build was skipped.
  ci-passed:
    needs: [docs, build, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo 'docs=${{ needs.docs.result }} build=${{ needs.build.result }} deploy=${{ needs.deploy.result }}'
          [ "$FAILED" = false ]
