name: CI

on:
  push:
    branches: [main]
  pull_request:
  # `nightly.yml` starts a deploy after it merges updates, because a merge made
  # with its token starts no push workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Main deploys the `dist` a pull request already built when the tree is the
  # same, which a rebase merge of an up-to-date branch gives. Only artifacts
  # from runs of this repository count: a fork's run could upload anything.
  find-dist:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run-id: ${{ steps.find.outputs.run-id }}
      artifact: ${{ steps.find.outputs.artifact }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
          SHA: ${{ github.sha }}
        run: |
          set -u
          tree=$(gh api "repos/$REPO/commits/$SHA" --jq .commit.tree.sha) || exit 0
          artifact="dist-$tree"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          run=$(gh api "repos/$REPO/actions/artifacts?name=$artifact&per_page=30" --jq \
            ".artifacts[] | select(.expired | not)
             | select(.workflow_run.head_repository_id == $REPO_ID) | .workflow_run.id" | head -n 1)
          if [ -n "$run" ]; then
            echo "Deploying $artifact from run $run."
            echo "run-id=$run" >> "$GITHUB_OUTPUT"
          else
            echo "No build of tree $tree yet; building it."
          fi

  # A pull request typechecks, lints and builds; this is the check required to
  # merge. Main builds only when no pull request built the same tree.
  build:
    needs: find-dist
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.find-dist.outputs.run-id == '') }}
    uses: ./.github/workflows/build.yml
    with:
      checks: ${{ github.event_name == 'pull_request' }}

  # Only main deploys. A pull request publishes nothing, so one change reaches
  # Cloudflare once.
  deploy:
    needs: [find-dist, build]
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' &&
      (needs.build.result == 'success' ||
      (needs.build.result == 'skipped' && needs.find-dist.outputs.run-id != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .nvmrc
            package.json
            package-lock.json
          sparse-checkout-cone-mode: false

      - id: node
        run: echo "major=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/hostedtoolcache/node/${{ steps.node.outputs.major }}.*
          key: node-${{ runner.os }}-${{ steps.node.outputs.major }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # The build's own cache, so wrangler is the version `package-lock.json`
      # pins and costs a restore rather than an install.
      - id: modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.find-dist.outputs.run-id != '' && needs.find-dist.outputs.artifact || needs.build.outputs.artifact }}
          run-id: ${{ needs.find-dist.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}
          path: dist

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: >-
          node_modules/.bin/wrangler pages deploy dist --project-name=sunset-driver
          --branch="$BRANCH" --commit-dirty=true --commit-hash="$SHA"
