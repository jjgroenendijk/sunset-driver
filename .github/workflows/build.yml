name: Build

# A reusable workflow: `ci.yml` calls it. It installs, optionally checks, builds
# and uploads `dist` as an artifact named after the tree it was built from, so
# main can deploy what a pull request built. It never deploys and holds no
# secret.
on:
  workflow_call:
    inputs:
      checks:
        description: Typecheck and run both lints beside the build.
        type: boolean
        default: true
    outputs:
      artifact:
        description: Name of the artifact that holds `dist`.
        value: ${{ jobs.build.outputs.artifact }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact: ${{ steps.tree.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # Tests run locally (`npm run verify`) and on Dependabot pull requests
      # and nightly (`full-tier.yml`), not here. `build:checked` runs the
      # checks and the build side by side.
      - run: npm run ${{ inputs.checks && 'build:checked' || 'build' }}

      - id: tree
        run: echo "artifact=dist-$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.tree.outputs.artifact }}
          path: dist
          if-no-files-found: error
          retention-days: 14
