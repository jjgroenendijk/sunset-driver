name: Build

# A reusable workflow: `ci.yml` calls it. It installs, optionally checks, builds
# and uploads `dist` as an artifact named after the tree it was built from, so
# main can deploy what a pull request built. It never deploys and holds no
# secret.
on:
  workflow_call:
    inputs:
      checks:
        description: Typecheck and run both lints beside the build.
        type: boolean
        default: true
    outputs:
      artifact:
        description: Name of the artifact that holds `dist`.
        value: ${{ jobs.build.outputs.artifact }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact: ${{ steps.tree.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-node downloads and unpacks Node on every run unless the version
      # is already in the tool cache, which costs more than restoring it.
      - id: node
        run: echo "major=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/hostedtoolcache/node/${{ steps.node.outputs.major }}.*
          key: node-${{ runner.os }}-${{ steps.node.outputs.major }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Restore node_modules
        id: modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      # Tests run locally (`npm run verify`) and nightly (`nightly.yml`), not
      # here. The checks and the build share nothing, so they run side by side.
      - name: Check and build
        env:
          CHECKS: ${{ inputs.checks }}
        run: |
          set -u
          tasks=(build)
          if [ "$CHECKS" = true ]; then tasks+=(typecheck lint lint:size); fi
          pids=()
          for task in "${tasks[@]}"; do
            (set -o pipefail; npm run -s "$task" 2>&1 | sed "s/^/[$task] /") &
            pids+=($!)
          done
          failed=0
          for i in "${!pids[@]}"; do
            wait "${pids[$i]}" || { echo "::error::npm run ${tasks[$i]} failed"; failed=1; }
          done
          exit $failed

      - id: tree
        run: echo "artifact=dist-$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.tree.outputs.artifact }}
          path: dist
          if-no-files-found: error
          retention-days: 14
