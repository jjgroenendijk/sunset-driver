name: Set up Node
description: >-
  Installs the Node of `.nvmrc` and the `node_modules` of `package-lock.json`,
  from caches when they hit. Needs a checkout that holds both files.

inputs:
  save:
    description: >-
      Save a cache that missed. A job that runs untrusted code sets `false`, so
      nothing it installs reaches a later job through the cache.
    default: 'true'

runs:
  using: composite
  steps:
    # setup-node downloads and unpacks Node on every run unless the version is
    # already in the tool cache, which costs more than restoring it.
    - id: node
      shell: bash
      run: echo "major=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
    - if: inputs.save == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /opt/hostedtoolcache/node/${{ steps.node.outputs.major }}.*
        key: node-${{ runner.os }}-${{ steps.node.outputs.major }}
    - if: inputs.save != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /opt/hostedtoolcache/node/${{ steps.node.outputs.major }}.*
        key: node-${{ runner.os }}-${{ steps.node.outputs.major }}

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        package-manager-cache: false

    - id: saved
      if: inputs.save == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}
    - id: restored
      if: inputs.save != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json') }}

    - if: steps.saved.outputs.cache-hit != 'true' && steps.restored.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --prefer-offline --no-audit --no-fund
