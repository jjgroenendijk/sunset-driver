name: Set up Node
description: >-
  Installs the Node of `.nvmrc` and the `node_modules` of `package-lock.json`,
  from caches when they hit. Needs a checkout that holds both files.

inputs:
  ignore-scripts:
    description: >-
      Install without the packages' install scripts, and save no cache. A job
      that holds a secret sets `true`, so no package's code runs beside it.
    default: 'false'

runs:
  using: composite
  steps:
    # setup-node downloads and unpacks Node on every run unless the version is
    # already in the tool cache, which costs more than restoring it. The key
    # follows the lockfile, so each dependency update also fetches the newest
    # Node of the major, and a patch release reaches CI.
    - id: keys
      shell: bash
      env:
        LOCK: ${{ hashFiles('package-lock.json') }}
      run: |
        major=$(cat .nvmrc)
        echo "node-path=/opt/hostedtoolcache/node/$major.*" >> "$GITHUB_OUTPUT"
        echo "node=node-$RUNNER_OS-$major-$LOCK" >> "$GITHUB_OUTPUT"
        echo "modules=modules-$RUNNER_OS-$major-$LOCK" >> "$GITHUB_OUTPUT"

    - if: inputs.ignore-scripts != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.keys.outputs.node-path }}
        key: ${{ steps.keys.outputs.node }}
    - if: inputs.ignore-scripts == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.keys.outputs.node-path }}
        key: ${{ steps.keys.outputs.node }}

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        package-manager-cache: false

    - id: saved
      if: inputs.ignore-scripts != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: ${{ steps.keys.outputs.modules }}
    - id: restored
      if: inputs.ignore-scripts == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: ${{ steps.keys.outputs.modules }}

    - if: steps.saved.outputs.cache-hit != 'true' && steps.restored.outputs.cache-hit != 'true'
      shell: bash
      env:
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: npm ci --prefer-offline --no-audit --no-fund --ignore-scripts="$IGNORE_SCRIPTS"
