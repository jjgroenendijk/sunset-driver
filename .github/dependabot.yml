version: 2
# Daily, before the 02:00 UTC run of `nightly.yml`, which tests the pull
# requests with the full tier and merges the ones that pass.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "00:30"
      timezone: UTC
    groups:
      all-npm:
        patterns: ["*"]
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "00:30"
      timezone: UTC
    groups:
      all-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
