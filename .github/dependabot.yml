version: 2
# Daily. `ci.yml` runs the full tier on each pull request and merges the ones
# that pass.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "00:30"
      timezone: UTC
    groups:
      all-npm:
        patterns: ["*"]
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    # The workflows, and the composite actions they use.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: daily
      time: "00:30"
      timezone: UTC
    groups:
      all-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
