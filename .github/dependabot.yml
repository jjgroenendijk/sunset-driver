version: 2
# Daily. `ci.yml` runs the full tier on each pull request and merges the ones
# that pass. A new release waits three days first, the time a malicious release
# is usually found and pulled in; Renovate's `security:minimumReleaseAgeNpm`
# waits the same. Security updates do not wait.
updates:
  - package-ecosystem: npm
    directory: /
    cooldown:
      default-days: 3
    schedule:
      interval: daily
      time: "00:30"
      timezone: UTC
    groups:
      all-npm:
        patterns: ["*"]
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    # The workflows, and the composite actions they use.
    directories: ["/", "/.github/actions/*"]
    cooldown:
      default-days: 3
    schedule:
      interval: daily
      time: "00:30"
      timezone: UTC
    groups:
      all-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
